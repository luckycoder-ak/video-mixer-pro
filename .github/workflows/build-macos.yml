name: Build macOS App

# 触发条件：
#   1. 手动触发（Actions 页面点 "Run workflow"）
#   2. push 形如 v1.0.0 的 tag 时触发并自动建 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# softprops/action-gh-release 创建 Release 需要写 Contents 权限
permissions:
  contents: write

jobs:
  build-macos:
    # 同时构建 Apple Silicon (arm64) 与 Intel (x64) 两份
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14         # M-series runner
            target: aarch64-apple-darwin
            ffmpeg_url: 'https://www.osxexperts.net/ffmpeg7arm.zip'
            ffprobe_url: 'https://www.osxexperts.net/ffprobe7arm.zip'
          - runner: macos-13         # Intel runner
            target: x86_64-apple-darwin
            ffmpeg_url: 'https://www.osxexperts.net/ffmpeg7intel.zip'
            ffprobe_url: 'https://www.osxexperts.net/ffprobe7intel.zip'

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 下载 macOS 静态构建的 ffmpeg / ffprobe，并按 Tauri sidecar 命名规范放入 binaries/
      # 这样 ffmpeg / ffprobe 会被打包进最终 .dmg/.app 安装包，用户无需单独 brew install ffmpeg
      - name: Download & bundle ffmpeg + ffprobe sidecar
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          TMPDIR_FF="$RUNNER_TEMP/ffmpeg-extract"
          mkdir -p "$TMPDIR_FF"

          echo "Downloading ffmpeg from ${{ matrix.ffmpeg_url }}"
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o "$TMPDIR_FF/ffmpeg.zip"
          unzip -o "$TMPDIR_FF/ffmpeg.zip" -d "$TMPDIR_FF"

          echo "Downloading ffprobe from ${{ matrix.ffprobe_url }}"
          curl -fsSL "${{ matrix.ffprobe_url }}" -o "$TMPDIR_FF/ffprobe.zip"
          unzip -o "$TMPDIR_FF/ffprobe.zip" -d "$TMPDIR_FF"

          FFMPEG_BIN=$(find "$TMPDIR_FF" -type f -name 'ffmpeg' | head -n 1)
          FFPROBE_BIN=$(find "$TMPDIR_FF" -type f -name 'ffprobe' | head -n 1)
          if [[ -z "$FFMPEG_BIN" ]]; then
            echo "ffmpeg binary not found in archive" >&2; exit 1
          fi
          if [[ -z "$FFPROBE_BIN" ]]; then
            echo "ffprobe binary not found in archive" >&2; exit 1
          fi

          # Tauri sidecar 命名要求：<name>-<target-triple>
          cp "$FFMPEG_BIN" "src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          cp "$FFPROBE_BIN" "src-tauri/binaries/ffprobe-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/ffprobe-${{ matrix.target }}"

          # 解除 quarantine 属性，避免 Gatekeeper 在打包阶段拦截
          xattr -dr com.apple.quarantine "src-tauri/binaries/ffmpeg-${{ matrix.target }}" || true
          xattr -dr com.apple.quarantine "src-tauri/binaries/ffprobe-${{ matrix.target }}" || true

          echo "Sidecar ffmpeg ready: src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          echo "Sidecar ffprobe ready: src-tauri/binaries/ffprobe-${{ matrix.target }}"

      # 下载 yt-dlp_macos 并按 Tauri sidecar 命名规范放入 binaries/
      - name: Download & bundle yt-dlp sidecar
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos \
            -o "src-tauri/binaries/yt-dlp-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/yt-dlp-${{ matrix.target }}"
          xattr -dr com.apple.quarantine "src-tauri/binaries/yt-dlp-${{ matrix.target }}" || true
          echo "Sidecar yt-dlp ready: src-tauri/binaries/yt-dlp-${{ matrix.target }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 构建前自检：确保 sidecar 三件套（ffmpeg / ffprobe / yt-dlp）都已就位且体积正常
      - name: Verify sidecar binaries before build
        run: |
          set -euo pipefail
          required=(
            "src-tauri/binaries/ffmpeg-${{ matrix.target }}"
            "src-tauri/binaries/ffprobe-${{ matrix.target }}"
            "src-tauri/binaries/yt-dlp-${{ matrix.target }}"
          )
          for p in "${required[@]}"; do
            if [[ ! -f "$p" ]]; then
              echo "缺失 sidecar 文件: $p" >&2; exit 1
            fi
            size=$(stat -f%z "$p" 2>/dev/null || stat -c%s "$p")
            if [[ "$size" -lt 102400 ]]; then
              echo "Sidecar 文件过小（疑似占位/损坏）: $p ($size bytes)" >&2; exit 1
            fi
            echo "OK: $p ($((size / 1024 / 1024)) MB)"
          done

      - name: Build Tauri (macOS .dmg + .app)
        run: npm run tauri build -- --target ${{ matrix.target }}

      # 构建后自检：确保最终 .app 内的 Resources 目录里捆绑了 sidecar
      - name: Verify sidecar binaries are bundled into .app
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -type d -name '*.app' -maxdepth 2 | head -n 1)
          if [[ -z "$APP" ]]; then
            echo "未找到 .app 包" >&2; exit 1
          fi
          echo "App bundle: $APP"
          for name in ffmpeg ffprobe yt-dlp; do
            # Tauri 2.0 把 sidecar 拷贝到 Contents/MacOS/<name>-<target-triple>
            # 同时也可能有 <name>（剥离后缀），二者满足其一即可
            found=$(find "$APP/Contents" -type f \( -name "$name" -o -name "$name-${{ matrix.target }}" \) | head -n 1)
            if [[ -z "$found" ]]; then
              echo "构建产物 .app 中未发现 sidecar: $name" >&2; exit 1
            fi
            size=$(stat -f%z "$found" 2>/dev/null || stat -c%s "$found")
            echo "OK: $found ($((size / 1024 / 1024)) MB)"
          done
          # 同时确保 .dmg 真实存在
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -type f -name '*.dmg' -maxdepth 2 | head -n 1)
          if [[ -z "$DMG" ]]; then
            echo "未找到 .dmg 安装包" >&2; exit 1
          fi
          dmg_size=$(stat -f%z "$DMG" 2>/dev/null || stat -c%s "$DMG")
          echo "DMG: $DMG ($((dmg_size / 1024 / 1024)) MB)"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-mixer-pro-macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 30

      # tag push 时同步发 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
